<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Data Cloud Ingest Test</title>
<style>
  body { font-family: -apple-system, Arial, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 20px; }
  button { font-size: 15px; padding: 10px 18px; margin: 6px 8px 6px 0; cursor: pointer; }
  #log { background: #111; color: #0f0; font-family: Menlo, monospace; font-size: 12px; padding: 12px;
         border-radius: 6px; height: 340px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
  .status { padding: 8px 12px; border-radius: 6px; margin: 10px 0; font-weight: bold; }
  .status.pending { background: #fff3cd; }
  .status.ok      { background: #d4edda; }
  .status.fail    { background: #f8d7da; }
</style>
</head>
<body>

<h1>Data Cloud — Ingest Test Page</h1>
<p>Simple test page, not a replacement for the real website — only used to check whether a new
data stream/sitemap can ingest into Data Cloud, fully isolated from the GTM/LiteSpeed issues on
custodian.com.au.</p>

<div id="beaconStatus" class="status pending">Beacon: not loaded yet...</div>
<div id="initStatus" class="status pending">SI.init: not run yet...</div>

<button id="btnSendPageview">Resend Page View</button>
<button id="btnSendTest">Send Test Event (each click is a new event)</button>

<h3>Log</h3>
<pre id="log"></pre>

<script id="beaconScript"
        src="https://cdn.c360a.salesforce.com/beacon/c360a/f4bb63bd-2cf4-42d3-81a6-6667cb2e8b2f/scripts/c360a.min.js"></script>

<script>
(function () {
  "use strict";
  if (window.__testIngestBooted) return;
  window.__testIngestBooted = true;

  var logEl = document.getElementById("log");
  function log(msg) {
    var t = new Date().toISOString().split("T")[1].replace("Z", "");
    logEl.textContent += "[" + t + "] " + msg + "\n";
    logEl.scrollTop = logEl.scrollHeight;
    console.log(msg);
  }
  function setStatus(id, cls, text) {
    var el = document.getElementById(id);
    el.className = "status " + cls;
    el.textContent = text;
  }

  var beaconSrc = document.getElementById("beaconScript").src;
  if (!beaconSrc || beaconSrc.indexOf("PASTE_YOUR_NEW_DATA_STREAM") !== -1) {
    setStatus("beaconStatus", "fail", "Beacon: script URL NOT set — edit the src on <script id=\"beaconScript\"> first.");
    log("Beacon src not configured. Stopping, will not attempt init.");
    return;
  }

  document.getElementById("beaconScript").addEventListener("load", function () {
    setStatus("beaconStatus", "ok", "Beacon: loaded successfully (" + beaconSrc + ")");
    log("c360a.min.js loaded OK.");
  });
  document.getElementById("beaconScript").addEventListener("error", function () {
    setStatus("beaconStatus", "fail", "Beacon: LOAD FAILED — check the URL / whether the domain is blocked by CORS.");
    log("c360a.min.js failed to load.");
  });

  var SI_READY = false;

  function boot() {
    var SI = window.SalesforceInteractions;
    if (!SI) return;

    try { SI.setLoggingLevel(5); } catch (e) { log("setLoggingLevel error: " + e); }

    SI.init({
      // cookieDomain: leave unset, or set it to whatever domain this page
      // actually runs on. If it ends up embedded via a sandboxed iframe (a
      // different domain entirely), just let the SDK use the current domain
      // instead of hardcoding one.
      consents: [
        { provider: "TestIngest Page", purpose: "Tracking", status: "Opt In" }
      ]
    }).then(function () {
      SI_READY = true;
      setStatus("initStatus", "ok", "SI.init: success, sitemap is ready.");
      log("SalesforceInteractions.init() resolved OK.");

      var pageTypes = [
        { name: "test_home", isMatch: function () { return true; }, interaction: { name: "Test_Home_View" } }
      ];

      SI.initSitemap({
        global: {
          locale: "en_US",
          onActionEvent: function (ae) {
            try {
              ae.interaction = ae.interaction || {};
              if (!ae.interaction.name) ae.interaction.name = "Test_Unnamed_Event";
            } catch (e) {}
            return ae;
          }
        },
        pageTypes: pageTypes,
        pageTypeDefault: { name: "test_default", interaction: { name: "Test_Page_View" } }
      });
      log("initSitemap() called — 1 page view event should fire now.");
    }).catch(function (e) {
      setStatus("initStatus", "fail", "SI.init: FAILED — see log.");
      log("SI.init failed: " + e);
    });
  }

  if (window.SalesforceInteractions) {
    boot();
  } else {
    var tries = 0;
    var poll = setInterval(function () {
      if (window.SalesforceInteractions) { clearInterval(poll); boot(); }
      else if (++tries > 100) { clearInterval(poll); log("Beacon never became ready after 10s."); }
    }, 100);
  }

  var manualCounter = 0;
  document.getElementById("btnSendPageview").addEventListener("click", function () {
    if (!SI_READY) { log("Init not finished yet, try again shortly."); return; }
    window.SalesforceInteractions.sendEvent({
      interaction: { name: "Test_Manual_Pageview" }
    });
    log("Manually sent: Test_Manual_Pageview");
  });

  document.getElementById("btnSendTest").addEventListener("click", function () {
    if (!SI_READY) { log("Init not finished yet, try again shortly."); return; }
    manualCounter++;
    window.SalesforceInteractions.sendEvent({
      interaction: {
        name: "Test_Manual_Event",
        attributes: { testSeq: manualCounter, clickedAt: new Date().toISOString() }
      }
    });
    log("Manually sent: Test_Manual_Event #" + manualCounter);
  });
})();
</script>

</body>
</html>
